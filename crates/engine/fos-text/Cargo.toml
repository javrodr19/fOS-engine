[package]
name = "fos-text"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Text rendering and font handling for fOS browser engine"

[features]
default = ["bundled-fonts"]
# Use bundled font rendering (custom parser + custom shaper)
bundled-fonts = []
# Use system FreeType for font rendering (smaller binary, requires libfreetype)
system-freetype = []

[dependencies]
memmap2 = "0.9"
# Rendering (for glyph rasterization)
tiny-skia.workspace = true

# Error handling
thiserror.workspace = true
rustc-hash = "2.1"
brotli-decompressor = "6.0.1"
ttf-parser = "0.25"
flate2 = "1"
wuff = { version = "0.2.9", default-features = false }

[dev-dependencies]
